id = "agy"
version = "2026.09.26.1"
min_engine_version = 1
updated_at = "2026-09-26T12:25:00Z"
aliases = ["antigravity", "antigravity-cli", "jetski", "jetski-cli"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["Requesting permission for:"] },
  { contains = ["Requesting permission to"] },
  { contains = ["Yes, run command"] },
  { contains = ["Run this command?"] },
  { contains = ["Yes, accept this change"] },
  { contains = ["Yes, allow access"] },
  { contains = ["Allow access to this file?"] },
  { contains = ["Yes, allow creation"] },
  { contains = ["Yes, allow tool call"] },
  { contains = ["Approve this action?"] },
  { contains = ["Do you want to proceed?"] },
  { contains = ["Allow calling this tool?"] },
  { contains = ["Grant requested permission?"] },
  { contains = ["Send input to this task?"] },
  { contains = ["No, deny permission"] },
  { contains = ["No, deny creation"] },
]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b']

[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']


