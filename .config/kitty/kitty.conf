# font_family      Source Code Pro for Powerline
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size 12.0

hide_window_decorations yes

tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

background_opacity         0.98
dynamic_background_opacity yes

notify_on_cmd_finish never
shell /bin/zsh --login --interactive


map ctrl+c copy_to_clipboard
map ctrl+v wl-paste
map ctrl+shift+c send_key ctrl+c

scrollback_lines 200000

# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font Mono' style=Retina
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
#t 
mouse_map ctrl+left click ungrabbed kitten hints --type=regex --regex "(ag/[0-9]+)" kitty-launch --type=background google-chrome --new-tab "https://example.com/{hint}"

mark1_foreground black
mark1_background green 

map f1 toggle_marker regex 1 "ag/[0-9]+"
map ctrl+shift+s launch --type=tab --tab-title "jedo@Desktop" ssh jedo@jedo003.kir.corp.google.com 

startup_session session.conf

map cmd+t no_op
map cmd+w no_op

